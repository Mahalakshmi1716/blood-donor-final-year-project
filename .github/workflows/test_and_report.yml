name: SymptoCare Complete Test Suite

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test-and-report:
    name: Execute SymptoCare Full Test Lifecycle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Global Testing Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl requests

    - name: Run Test Suite and Generate Report
      run: |
        python run_tests_ci.py

    - name: Upload Test Report Excel
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-excel
        path: |
          test_results.xlsx
          test_results-backup.xlsx
